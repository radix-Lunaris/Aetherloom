[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aetherloom"
version = "0.4.0a12"
description = "Minecraft host hopping with authoritative self-hosted cloud saves"
requires-python = ">=3.11"
[project.optional-dependencies]
desktop = ["customtkinter==5.2.2", "pillow==13.0.0", "websockets==15.0.1"]
server = ["fastapi", "uvicorn", "PyMySQL", "cryptography", "websockets==15.0.1"]
[project.scripts]
aetherloom = "aetherloom.__main__:main"

