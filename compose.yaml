services:
  control:
    image: "${AETHERLOOM_CONTROL_IMAGE:-aetherloom-control:latest}"
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        PYTHON_IMAGE: "${AETHERLOOM_PYTHON_IMAGE:-python:3.11-slim}"
    restart: unless-stopped
    environment:
      AETHERLOOM_PANEL: "${AETHERLOOM_PANEL:-0}"
      AETHERLOOM_MYSQL_HOST: mysql
      AETHERLOOM_MYSQL_DATABASE: aetherloom
      AETHERLOOM_MYSQL_USER: aetherloom
      AETHERLOOM_MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      AETHERLOOM_P2P_BIND: "0.0.0.0:52861"
      AETHERLOOM_STUN_ENABLED: "1"
      AETHERLOOM_STUN_PORT: "52718"
      AETHERLOOM_STUN_PORT2: "52719"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${AETHERLOOM_BIND:-127.0.0.1}:8765:8765"
      - "52861:52861/udp"
    volumes:
      - aetherloom-data:/data
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  stun:
    image: "${AETHERLOOM_CONTROL_IMAGE:-aetherloom-control:latest}"
    restart: unless-stopped
    command: ["python", "-m", "aetherloom.stun_service"]
    environment:
      AETHERLOOM_STUN_ENABLED: "1"
      AETHERLOOM_STUN_PORT: "52718"
      AETHERLOOM_STUN_PORT2: "52719"
    ports:
      - "52718:52718/udp"
      - "52719:52719/udp"
    healthcheck:
      disable: true
    mem_limit: 64m
    cpus: 0.15
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  mysql:
    image: "${AETHERLOOM_MYSQL_IMAGE:-mysql:8.4}"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aetherloom
      MYSQL_USER: aetherloom
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=40", "--performance-schema=OFF", "--mysqlx=OFF"]
    volumes:
      - aetherloom-mysql:/var/lib/mysql
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  aetherloom-data:
  aetherloom-mysql:

