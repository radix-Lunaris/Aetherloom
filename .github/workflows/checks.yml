name: Core checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r server/requirements.txt httpx
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: pip install customtkinter==5.2.2 pillow==13.0.0
      - if: runner.os == 'Windows'
        run: python scripts/smoke_desktop.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl --fail http://127.0.0.1:8765/health
      - if: always()
        run: docker compose logs && docker compose down

