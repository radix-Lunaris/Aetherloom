<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetherloom 管理面板</title><link rel="stylesheet" href="panel.css"><script src="panel.js" defer></script></head><body><main><header><div class="brand">Aetherloom</div><p>共享世界 · 控制中心</p></header><section id="login-section"><h1>管理员登录</h1><p>使用服务器 root 或 admin 账号。游戏离线身份与此账号独立。</p><form id="login"><label>软件账号<input id="username" autocomplete="username" required maxlength="32"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button>登录控制中心</button></form></section><div id="workspace" hidden><div class="bar"><h1>服务器概况</h1><button id="refresh">刷新</button><button id="logout">退出登录</button></div><div id="metrics" class="metrics"></div><section><h2>实例与会话</h2><p class="notice">当前为控制服务开发版。自动 Hop、游戏 Bridge 与 AUTO 隧道尚未接通。</p><div class="table-wrap"><table><thead><tr><th>实例 ID</th><th>所有者</th><th>Host</th><th>状态</th><th>代次</th></tr></thead><tbody id="rooms"></tbody></table></div></section><section><h2>账号管理</h2><form id="create-user" class="account-form"><label>账号<input id="new-name" required pattern="[A-Za-z0-9_-]{1,32}" maxlength="32" autocomplete="off"></label><label>初始密码<input id="new-password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><label>服务器角色<select id="new-role"><option value="player">player · 普通账号</option><option id="admin-option" value="admin">admin · 服务器管理员</option></select></label><button>创建账号</button></form><table><thead><tr><th>账号</th><th>服务器角色</th></tr></thead><tbody id="users"></tbody></table><p>服务器角色、实例管理角色、当前 Host 为独立权限层。此页面暂提供开户和只读监测。</p></section></div><p id="message" role="status"></p><footer>HTTPS 访问 · 登录凭据仅保留在当前页面内存 · 刷新页面需重新登录</footer></main></body></html>
